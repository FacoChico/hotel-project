server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: booking-service
  cloud:
    loadbalancer:
      retry:
        enabled: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: jdbc:h2:mem:booking_service;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  h2:
    console:
      enabled: false
  task:
    scheduling:
      pool:
        size: 1
      thread-name-prefix: booking-recovery-

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    hostname: ${SERVICE_HOSTNAME:localhost}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: true

info:
  application:
    name: ${spring.application.name}

security:
  bootstrap-admin:
    # bootstrap admin is needed until h2 is used or there is no admin in the db
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:true}
    username: ${BOOTSTRAP_ADMIN_USERNAME:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  jwt:
    issuer: ${JWT_ISSUER:hotel-booking}
    audience: ${JWT_AUDIENCE:hotel-api}
    public-key: ${JWT_PUBLIC_KEY:}
    private-key: ${JWT_PRIVATE_KEY:}
  service-jwt:
    audience: ${SERVICE_JWT_AUDIENCE:hotel-internal}

booking:
  recovery:
    enabled: ${BOOKING_RECOVERY_ENABLED:true}
    batch-size: ${BOOKING_RECOVERY_BATCH_SIZE:20}
    poll-interval-ms: ${BOOKING_RECOVERY_POLL_INTERVAL_MS:5000}
    retry-delay-ms: ${BOOKING_RECOVERY_RETRY_DELAY_MS:5000}
    cycle-timeout-ms: ${BOOKING_RECOVERY_CYCLE_TIMEOUT_MS:10000}
  hotel-client:
    connect-timeout-ms: ${HOTEL_CONNECT_TIMEOUT_MS:1000}
    read-timeout-ms: ${HOTEL_READ_TIMEOUT_MS:2000}
    max-attempts: ${HOTEL_MAX_ATTEMPTS:3}
    backoff-ms: ${HOTEL_BACKOFF_MS:100}
    operation-timeout-ms: ${BOOKING_OPERATION_TIMEOUT_MS:10000}

springdoc:
  default-produces-media-type: application/json
  paths-to-match: /api/v1/**
  override-with-generic-response: false
  swagger-ui:
    disable-swagger-default-url: true
    persist-authorization: false
