server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: hotels-collection
              uri: lb://hotel-service
              predicates:
                - Path=/api/v1/hotels
                - Method=GET,POST
            - id: hotel-item
              uri: lb://hotel-service
              predicates:
                - Path=/api/v1/hotels/{id:[0-9]+}
                - Method=GET,PATCH,DELETE
            - id: rooms-collection
              uri: lb://hotel-service
              predicates:
                - Path=/api/v1/rooms
                - Method=GET,POST
            - id: room-item
              uri: lb://hotel-service
              predicates:
                - Path=/api/v1/rooms/{id:[0-9]+}
                - Method=GET,PATCH,DELETE
            - id: room-recommendations-and-statistics
              uri: lb://hotel-service
              predicates:
                - Path=/api/v1/rooms/recommend,/api/v1/rooms/statistics
                - Method=GET
            - id: users-collection
              uri: lb://booking-service
              predicates:
                - Path=/api/v1/users
                - Method=GET,POST
            - id: user-item
              uri: lb://booking-service
              predicates:
                - Path=/api/v1/users/{id:[0-9]+}
                - Method=GET,PATCH,DELETE
            - id: user-authentication
              uri: lb://booking-service
              predicates:
                - Path=/api/v1/users/register,/api/v1/users/auth
                - Method=POST
            - id: bookings-collection
              uri: lb://booking-service
              predicates:
                - Path=/api/v1/bookings
                - Method=GET,POST
            - id: booking-recommendations
              uri: lb://booking-service
              predicates:
                - Path=/api/v1/bookings/recommendations
                - Method=GET
            - id: booking-item
              uri: lb://booking-service
              predicates:
                - Path=/api/v1/bookings/{id:[0-9]+}
                - Method=GET,DELETE

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    hostname: ${SERVICE_HOSTNAME:localhost}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: true

info:
  application:
    name: ${spring.application.name}
