server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: hotels-collection
              uri: lb://hotel-service
              predicates:
                - Path=/api/hotels/v1
                - Method=GET,POST
            - id: hotel-item
              uri: lb://hotel-service
              predicates:
                - Path=/api/hotels/v1/{id}
                - Method=GET,PATCH,DELETE
            - id: rooms-collection
              uri: lb://hotel-service
              predicates:
                - Path=/api/rooms/v1
                - Method=GET,POST
            - id: room-item
              uri: lb://hotel-service
              predicates:
                - Path=/api/rooms/v1/{id}
                - Method=GET,PATCH,DELETE
            - id: room-recommendations-and-statistics
              uri: lb://hotel-service
              predicates:
                - Path=/api/rooms/v1/recommend,/api/rooms/v1/statistics
                - Method=GET
            - id: users-collection
              uri: lb://booking-service
              predicates:
                - Path=/api/users/v1
                - Method=GET,POST
            - id: user-item
              uri: lb://booking-service
              predicates:
                - Path=/api/users/v1/{id}
                - Method=GET,PATCH,DELETE
            - id: user-authentication
              uri: lb://booking-service
              predicates:
                - Path=/api/users/v1/register,/api/users/v1/auth
                - Method=POST
            - id: bookings-collection
              uri: lb://booking-service
              predicates:
                - Path=/api/bookings/v1
                - Method=GET,POST
            - id: booking-item
              uri: lb://booking-service
              predicates:
                - Path=/api/bookings/v1/{id}
                - Method=GET,DELETE

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    hostname: ${SERVICE_HOSTNAME:localhost}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: true

info:
  application:
    name: ${spring.application.name}
